apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopstool-k8s-deployment
  labels:
    app: devopstool-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopstool-k8s
  template:
    metadata:
      labels:
        app: devopstool-k8s
    spec:
      containers:
        - name: devopstool-k8s
          image: ghcr.io/akbaralishaikh-devop/devopstool:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: ghcr-secret   # Add your imagePullSecret here

---

apiVersion: v1
kind: Service
metadata:
  name: devopstool-k8ssvc
spec:
  selector:
    app: devopstool-k8s
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
